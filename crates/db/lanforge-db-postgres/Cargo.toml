[package]
name = "lanforge-db-postgres"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["ring"]
ring = ["sqlx/tls-rustls-ring", "tls-ring"]
aws-lc = ["sqlx/tls-rustls-aws-lc-rs", "tls-aws-lc"]
tls-ring = ["sqlx/tls-rustls-ring"]
tls-aws-lc = ["sqlx/tls-rustls-aws-lc-rs"]
hotpath = ["lanforge-core/hotpath"]
hotpath-alloc = ["lanforge-core/hotpath-alloc"]

[dependencies]
# Lanforge
lanforge-types = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-db-core = { path = "../lanforge-db-core" }
lanforge-core = { workspace = true }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }

# SQL & driver specific
mac_address = "1.1"
ipnetwork = "0.21"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "chrono",
    "uuid",
    "migrate",
    "postgres",
    "mac_address",
    "ipnetwork",
] }
