[package]
name = "lanforge-db"
version = "0.12.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["postgres"]
postgres = ["dep:lanforge-db-postgres"]
adblock = ["lanforge-core/adblock"]
hotpath = [
    "dep:hotpath",
    "lanforge-core/hotpath",
    "lanforge-db-postgres/hotpath",
]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
    "lanforge-db-postgres/hotpath-alloc",
]

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-types = { workspace = true }
lanforge-db-core = { path = "../lanforge-db-core" }
lanforge-db-logbuf = { path = "../lanforge-db-logbuf" }
lanforge-db-postgres = { path = "../lanforge-db-postgres", optional = true }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
hotpath = { workspace = true, optional = true }
futures.workspace = true
parking_lot.workspace = true


[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
