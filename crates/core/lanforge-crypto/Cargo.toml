[package]
name = "lanforge-crypto"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
argon2 = { workspace = true }
password-hash = { workspace = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
sha2 = "0.10.9"
rustls = { workspace = true, optional = true }
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
thiserror = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
aws-lc-rs = { version = "1.18.1", optional = true, default-features = false, features = ["aws-lc-sys"] }

[features]
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:thiserror"]
ring = ["dep:ring", "rustls?/ring"]
aws-lc = ["dep:aws-lc-rs", "rustls?/aws-lc-rs"]

[lints]
workspace = true
