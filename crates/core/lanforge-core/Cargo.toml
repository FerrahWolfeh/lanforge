[package]
name = "lanforge-core"
version = "0.23.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-macros = { workspace = true }
lanforge-types = { workspace = true }

# Workspace
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
serde = { workspace = true, features = ["rc"] }
hotpath = { workspace = true, optional = true }
smallvec = { workspace = true }

# Third party
argon2 = { version = "0.5.3" }
rand = { version = "0.8.6" }
parking_lot = { version = "0.12.5" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread"] }

[features]
adblock = ["lanforge-types/adblock"]
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
default = []
