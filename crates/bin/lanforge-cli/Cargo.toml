[package]
name = "lanforge-cli"
version = "2.3.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "lanforge_cli"
path = "src/lib.rs"

[[bin]]
name = "lanforge"
path = "src/main.rs"

[features]
default = ["remote", "ring"]
ring = ["rustls/ring", "lanforge-http?/ring", "hyper-rustls?/ring"]
aws-lc = ["rustls/aws-lc-rs", "lanforge-http?/aws-lc", "hyper-rustls?/aws-lc-rs"]
remote = [
    "dep:lanforge-http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:rustls-pki-types",
    "dep:tokio-tungstenite",
    "dep:url",
    "dep:futures",
    "dep:http",
]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-tree-widget", "dep:tui-input"]

[dependencies]
# Lanforge
lanforge-types = { workspace = true, features = ["adblock"] }
lanforge-macros = { workspace = true }
lanforge-api = { workspace = true }
lanforge-http = { workspace = true, features = ["client"], optional = true }

# Workspace
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
futures = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1", "http2"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"], optional = true }
hyper-rustls = { workspace = true, features = ["http1", "http2", "webpki-roots"], optional = true }
http-body-util = { workspace = true, optional = true }
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
postcard = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

# Third party
bytesize = { workspace = true }
color-eyre = "0.6.5"
colored = "3.1.1"
inquire = "0.9.4"
comfy-table = "7.1"
mac_oui = { version = "0.4.11", features = ["with-db"] }
duration-str = "0.21.0"
ratatui = { version = "0.30.1", features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-tree-widget = { version = "0.24.0", optional = true }
tui-input = { version = "0.15.3", optional = true }
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots",
], optional = true }
url = { version = "2.5.4", optional = true }
http = { version = "1.2.0", optional = true }
directories = "6.0.0"
chacha20poly1305 = "0.11.0"

[dev-dependencies]
lanforge-core = { workspace = true, features = ["adblock"] }
lanforge-uds = { workspace = true, features = ["adblock"] }
lanforge-db = { workspace = true, features = ["adblock"] }
tempfile = { workspace = true }
