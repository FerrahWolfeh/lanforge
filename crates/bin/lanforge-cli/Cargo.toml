[package]
name = "lanforge-cli"
version.workspace = true
build = "../build_id.rs"
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "lanforge_cli"
path = "src/lib.rs"

[[bin]]
name = "lanforge"
path = "src/main.rs"

[features]
default = ["remote", "ring"]
ring = ["rustls/ring", "hyper-rustls?/ring"]
aws-lc = ["rustls/aws-lc-rs", "hyper-rustls?/aws-lc-rs"]
remote = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:rustls-pki-types",
    "dep:futures",
    "dep:url",
]

[dependencies]
# Lanforge
lanforge-types = { workspace = true, features = ["adblock"] }
lanforge-api = { workspace = true }

# Workspace
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
bytes = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
futures = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1", "http2"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"], optional = true }
hyper-rustls = { workspace = true, features = ["http1", "http2", "webpki-roots"], optional = true }
http-body-util = { workspace = true, optional = true }
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

# Third party
bytesize = { workspace = true }
color-eyre = "0.6.5"
colored = "3.1.1"
inquire = "0.9.4"
comfy-table = { version = "7.1", features = ["custom_styling"] }
duration-str = "0.21.0"
url = { version = "2.5.4", optional = true }
directories = "6.0.0"
chacha20poly1305 = "0.11.0"
libc.workspace = true

[dev-dependencies]
lanforge-core = { workspace = true, features = ["adblock"] }
lanforge-uds = { workspace = true, features = ["adblock"] }
lanforge-db = { workspace = true, features = ["adblock"] }
tempfile = { workspace = true }
