[package]
name = "lanforge"
version = "0.23.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lanforged"
path = "src/main.rs"

[features]
default = [
    "dhcp",
    "dns",
    "ra",
    "tftp",
    "pppoe",
    "discovery",
    "http",
    "https",
    "uds",
    "dns-dot",
    "dns-doh",
    "adblock",
    "doh-server",
    "webui",
    "ring",
]

# Service Features
dhcp = ["dep:lanforge-dhcp"]
dns = ["dep:lanforge-dns"]
ra = ["dep:lanforge-ra"]
tftp = ["dep:lanforge-tftp"]
pppoe = ["dep:lanforge-pppoe"]
discovery = []
http = ["dep:lanforge-http", "lanforge-http/server"]
uds = ["dep:lanforge-uds"]
webui = ["http", "lanforge-http/webui"]

# Profiling & Diagnostics
hotpath = [
    "dep:hotpath",
    "hotpath/hotpath",
    "hotpath/threads",
    "hotpath/tokio",
    "lanforge-core/hotpath",
    "lanforge-api-dispatch/hotpath",
    "lanforge-dns?/hotpath",
    "lanforge-dhcp?/hotpath",
    "lanforge-ra?/hotpath",
    "lanforge-pppoe?/hotpath",
    "lanforge-discovery/hotpath",
    "lanforge-db/hotpath",
]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
    "lanforge-dns?/hotpath-alloc",
    "lanforge-dhcp?/hotpath-alloc",
    "lanforge-ra?/hotpath-alloc",
    "lanforge-pppoe?/hotpath-alloc",
    "lanforge-discovery/hotpath-alloc",
    "lanforge-db/hotpath-alloc",
]
jemalloc = ["dep:tikv-jemallocator"]


# DNS Upstream Protocols (Forwarding)
dns-dot = ["dns", "lanforge-dns/dot"]
dns-doq = ["dns", "lanforge-dns/doq"]
dns-doh = ["dns", "lanforge-dns/doh-upstream"]
dns-full = ["dns-dot", "dns-doq"]

# Networking Protocols
https = ["http", "lanforge-http/server"]
doh-server = ["http", "lanforge-http/doh"]

# Core Features
adblock = [
    "lanforge-dns?/adblock",
    "lanforge-db/adblock",
    "lanforge-uds?/adblock",
    "lanforge-http?/adblock",
]
# Crypto features
ring = [
    "rustls/ring",
    "lanforge-dns?/ring",
    "lanforge-http?/ring",
]
aws-lc = [
    "rustls/aws-lc-rs",
    "lanforge-dns?/aws-lc",
    "lanforge-http?/aws-lc",
]

# Meta-features / Build Profiles
full = [
    "dhcp",
    "dns",
    "ra",
    "tftp",
    "pppoe",
    "discovery",
    "http",
    "uds",
    "dns-full",
    "dns-doh",
    "adblock",
    "webui",
]

profile-minimal = ["dns", "dhcp", "ra", "uds"]
profile-soho = [
    "dns",
    "dhcp",
    "ra",
    "tftp",
    "pppoe",
    "uds",
    "discovery",
    "http",
    "adblock",
    "webui",
]
profile-enterprise = [
    "dns",
    "dhcp",
    "ra",
    "tftp",
    "pppoe",
    "uds",
    "discovery",
    "http",
    "adblock",
    "dns-full",
    "webui",
]


[dependencies]
# === L0 (Foundational) ===
lanforge-types = { workspace = true }

# === L1 (Core APIs & Logic) ===
lanforge-core = { workspace = true }

# === L2 (Specialized Services - Required) ===
lanforge-db = { workspace = true }
lanforge-discovery = { workspace = true }
lanforge-wol = { workspace = true }

# === L2 (Specialized Services - Optional / Feature Gated) ===
lanforge-dns = { workspace = true, optional = true }
lanforge-dhcp = { workspace = true, optional = true }
lanforge-ra = { workspace = true, optional = true }
lanforge-uds = { workspace = true, optional = true }
lanforge-http = { workspace = true, optional = true }
lanforge-tftp = { workspace = true, optional = true }
lanforge-pppoe = { workspace = true, optional = true }


# Async & runtime
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
] }
futures = { workspace = true }
rustls = { workspace = true }

# CLI e config
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
bytesize = { workspace = true }

# Networking / netlink
netlink-sys = { workspace = true }
rtnetlink = { workspace = true }
pnet = { workspace = true }

# Observabilidade
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
hotpath = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }


[dev-dependencies]
tokio = { workspace = true, features = ["full", "io-util"] }
tempfile = "3.10.1"
serde_json = { workspace = true }
lanforge-api-dispatch = { workspace = true }
lanforge-api = { workspace = true }
