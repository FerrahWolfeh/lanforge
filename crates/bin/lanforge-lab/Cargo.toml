[package]
name = "lanforge-lab"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "lanforge_lab"
path = "src/lib.rs"

[[bin]]
name = "lanforge-lab"
path = "src/main.rs"

[dependencies]
# Lanforge
lanforge-types = { workspace = true, features = ["adblock"] }
lanforge-core = { workspace = true, features = ["adblock"] }
lanforge-dns-wire = { workspace = true }
lanforge-dhcp = { workspace = true }
lanforge-dns = { workspace = true }
lanforge-ra = { workspace = true }
lanforge-discovery = { workspace = true }

# Workspace
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
socket2 = { workspace = true }
pnet = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }

# TUI & Terminal
ratatui = { version = "0.30.1", features = ["crossterm"] }
crossterm = { version = "0.29.0" }
color-eyre = "0.6.5"
colored = "3.1.1"

# Third party
dhcproto = "0.15.0"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
