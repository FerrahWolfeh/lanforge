[package]
name = "lanforge-dhcp"
version = "1.2.1"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-types = { workspace = true }

# Workspace
hotpath = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "time",
    "net",
    "io-util",
    "macros",
    "sync",
] }
serde = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
socket2 = { workspace = true }
rand = { workspace = true }
pnet = { workspace = true }
hex = { workspace = true }

# Third party
dhcproto = "0.15.0"
roaring = "0.11.3"

[features]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
