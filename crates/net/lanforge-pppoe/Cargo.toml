[package]
name = "lanforge-pppoe"
version = "0.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-types = { workspace = true }

# Workspace & Async
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "time",
    "io-util",
    "macros",
    "sync",
    "process",
] }
serde = { workspace = true }
tracing = { workspace = true }

# Third party protocol / low level
libc = "0.2"
nix = { version = "0.31.3", features = ["socket", "ioctl", "net", "fs"] }
pnet = "0.35.0"
md-5 = "0.11.0"
rand = "0.10.2"
hotpath = { workspace = true, optional = true }
rtnetlink = "0.20.0"
nftables = "0.6.3"

[features]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
