[package]
name = "lanforge-pppoe"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-types = { workspace = true }
lanforge-transport = { workspace = true }

# Workspace & Async
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "time",
    "io-util",
    "macros",
    "sync",
    "process",
] }
tracing = { workspace = true }
libc = { workspace = true }
rtnetlink = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
sd-notify = { workspace = true, features = ["fdstore"] }

# Third party protocol / low level
nix = { version = "0.31.3", features = ["socket", "ioctl", "net", "fs"] }
md-5 = "0.11.0"
smallvec = { workspace = true }

[features]
hotpath = ["lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
