[package]
name = "lanforge-pppoe"
version = "0.3.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-types = { workspace = true }

# Workspace & Async
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "time",
    "io-util",
    "macros",
    "sync",
    "process",
] }
serde = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
rtnetlink = { workspace = true }
rand = { workspace = true }
pnet = { workspace = true }
futures = { workspace = true }
hotpath = { workspace = true, optional = true }

# Third party protocol / low level
nix = { version = "0.31.3", features = ["socket", "ioctl", "net", "fs"] }
md-5 = "0.11.0"
aya = "0.13.1"

[features]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
