[package]
name = "lanforge-dns"
version = "2.7.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true }
lanforge-macros = { workspace = true }
lanforge-transport = { workspace = true }
lanforge-types = { workspace = true }
lanforge-dns-wire = { workspace = true }

# Workspace
tokio = { workspace = true, features = ["io-util", "net", "time", "rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
hotpath = { workspace = true, optional = true }
smallvec = { workspace = true }
tempfile = { workspace = true }
globset = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
rustls = { workspace = true, optional = true }
chrono = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }

# Third party
dashmap = { version = "6.1.0" }
parking_lot = "0.12.5"
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { version = "1.0.7", optional = true }
quinn = { version = "0.11.9", features = [
    "runtime-tokio",
], default-features = false, optional = true }
hyper = { version = "1.8.1", features = [
    "client",
    "http1",
    "http2",
], optional = true, default-features = false }
hyper-util = { version = "0.1.13", features = [
    "client-legacy",
], optional = true, default-features = false }
hyper-rustls = { version = "0.27.9", features = [
    "http1",
    "http2",
    "webpki-roots",
], optional = true, default-features = false }
http-body-util = { version = "0.1.3", optional = true }
base64 = { workspace = true, optional = true }
once_cell = "1.21.4"

# Adblock
memmap2 = { version = "0.9.11", optional = true }
rkyv = { version = "0.8.18", optional = true }
fst = { version = "0.4.7", optional = true }

[features]
aws-lc = [
    "rustls?/aws-lc-rs",
    "quinn?/rustls-aws-lc-rs",
    "hyper-rustls?/aws-lc-rs",
    "tokio-rustls?/aws-lc-rs",
]
ring = [
    "rustls?/ring",
    "quinn?/rustls-ring",
    "hyper-rustls?/ring",
    "tokio-rustls?/ring",
]
adblock = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:memmap2",
    "dep:fst",
    "lanforge-core/adblock",
]
dot = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
doq = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
doh-upstream = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:base64",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = ["adblock", "dot", "doh-upstream", "ring"]
rkyv = ["dep:rkyv"]


[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt",
    "rt-multi-thread",
    "time",
] }
