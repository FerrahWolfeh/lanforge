[package]
name = "lanforge-http"
version = "0.10.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true, optional = true }
lanforge-api = { workspace = true }
lanforge-api-dispatch = { workspace = true, optional = true }
lanforge-db-core = { workspace = true, optional = true }
lanforge-dns = { workspace = true, optional = true }
lanforge-dns-wire = { workspace = true, optional = true }
lanforge-macros = { workspace = true, optional = true }
lanforge-types = { workspace = true }
lanforge-dhcp = { workspace = true, optional = true }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# Server dependencies
axum = { version = "0.8.8", optional = true }
tower-http = { version = "0.7.0", features = [
    "cors",
    "fs",
    "trace",
    "compression-gzip",
    "compression-br",
], optional = true }
jsonwebtoken = { version = "11.0.0", optional = true, default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
axum-server = { version = "0.8.0", optional = true, features = [
    "tls-rustls-no-provider",
] }
url = { version = "2.5.4", optional = true }
base64 = { workspace = true, optional = true }
async-stream = { version = "0.3.6", optional = true }
lanforge-webui = { workspace = true, optional = true }

# Client dependencies
hyper = { workspace = true, features = ["client", "http1", "http2"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"], optional = true }
hyper-rustls = { workspace = true, features = ["http1", "http2", "webpki-roots"], optional = true }
http-body-util = { workspace = true, optional = true }

[features]
default = ["server", "client", "ring"]
ring = [
    "rustls?/ring",
    "hyper-rustls?/ring",
    "lanforge-dns?/ring",
]
aws-lc = [
    "rustls?/aws-lc-rs",
    "hyper-rustls?/aws-lc-rs",
    "lanforge-dns?/aws-lc",
]
server = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:jsonwebtoken",
    "dep:axum-server",
    "dep:futures",
    "dep:rustls",
    "dep:lanforge-db-core",
    "dep:lanforge-dns",
    "dep:lanforge-api-dispatch",
    "dep:lanforge-dns-wire",
    "dep:lanforge-macros",
    "dep:lanforge-core",
    "dep:lanforge-dhcp",
    "dep:chrono",
    "dep:rand",
    "dep:async-stream",
    "dep:libc",
]
client = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:bytes",
    "dep:rustls",
    "dep:url",
]
doh = ["server", "dep:base64"]
webui = ["server", "dep:lanforge-webui"]
adblock = [
    "lanforge-api-dispatch/adblock",
    "lanforge-db-core/adblock",
    "lanforge-dns/adblock",
]
hotpath = [
    "lanforge-core/hotpath",
    "lanforge-api-dispatch/hotpath",
    "lanforge-db-core/hotpath",
    "lanforge-dns/hotpath",
]

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
lanforge-db = { workspace = true }
