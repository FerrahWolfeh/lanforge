[package]
name = "lanforge-http"
version = "0.7.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { workspace = true, optional = true }
lanforge-api = { workspace = true }
lanforge-api-dispatch = { workspace = true, optional = true }
lanforge-db = { workspace = true, optional = true }
lanforge-dns = { workspace = true, optional = true }
lanforge-dns-wire = { workspace = true, optional = true }
lanforge-macros = { workspace = true, optional = true }
lanforge-types = { workspace = true, optional = true }
lanforge-dhcp = { workspace = true, optional = true }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json"], optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

# Server dependencies
axum = { version = "0.8.8", optional = true }
tower-http = { version = "0.7.0", features = [
    "cors",
    "fs",
    "trace",
    "compression-full",
], optional = true }
jsonwebtoken = { version = "11.0.0", optional = true, default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
axum-server = { version = "0.8.0", optional = true, features = [
    "tls-rustls-no-provider",
] }
url = { version = "2.5.4", optional = true }
async-trait = { version = "0.1.86", optional = true }
base64 = { version = "0.23.0", optional = true }
async-stream = { version = "0.3.6", optional = true }
rust-embed = { version = "8.5.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }

[features]
default = ["server", "client"]
server = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:jsonwebtoken",
    "dep:axum-server",
    "dep:futures",
    "dep:rustls",
    "dep:lanforge-db",
    "dep:lanforge-dns",
    "dep:lanforge-api-dispatch",
    "dep:lanforge-dns-wire",
    "dep:lanforge-macros",
    "dep:lanforge-core",
    "dep:lanforge-types",
    "dep:lanforge-dhcp",
    "dep:chrono",
    "dep:async-trait",
    "dep:rand",
    "dep:async-stream",
]
client = ["dep:reqwest", "dep:url"]
doh = ["server", "dep:base64"]
webui = ["server", "dep:rust-embed", "dep:mime_guess"]
adblock = [
    "lanforge-api-dispatch/adblock",
    "lanforge-db/adblock",
    "lanforge-dns/adblock",
]
hotpath = [
    "lanforge-core/hotpath",
    "lanforge-api-dispatch/hotpath",
    "lanforge-db/hotpath",
    "lanforge-dns/hotpath",
]

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { workspace = true, features = ["json"] }
