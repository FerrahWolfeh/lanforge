[package]
name = "lanforge-api-dispatch"
version = "0.30.0"
edition.workspace = true
authors.workspace = true

[dependencies]
lanforge-types = { workspace = true }
lanforge-core = { workspace = true }
lanforge-db-core = { workspace = true }
lanforge-api = { workspace = true }
lanforge-dns = { workspace = true }
lanforge-dns-wire = { workspace = true }
lanforge-macros = { workspace = true }
toml = { workspace = true }

tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
pnet = { workspace = true }
hotpath = { workspace = true, optional = true }

[features]
adblock = [
    "lanforge-types/adblock",
    "lanforge-core/adblock",
    "lanforge-db-core/adblock",
    "lanforge-dns/adblock",
    "lanforge-api/adblock",
]
hotpath = [
    "dep:hotpath",
    "lanforge-core/hotpath",
    "lanforge-db-core/hotpath",
    "lanforge-dns/hotpath",
]
[dev-dependencies]
lanforge-dhcp = { workspace = true }
lanforge-db = { workspace = true }
