[package]
name = "lanforge-api"
version = "0.10.1"
edition = "2024"

[dependencies]
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }

hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio = { version = "1", features = ["io-util"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio-util = { version = "0.7.18" }
bincode = "1.3.3"
async-trait = "0.1.86"
hickory-proto = { version = "0.26.1", default-features = false, features = [
    "std",
] }
zstd = { version = "0.13", optional = true }

hotpath = { workspace = true, optional = true }


# No optional dependencies here, they moved to lanforge-http and lanforge-dns

[features]
adblock = ["lanforge-core/adblock", "lanforge-dns/adblock"]
default = []
zstd = ["dep:zstd"]
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
