[package]
name = "lanforge-api"
version = "0.21.0"
license.workspace = true
edition = "2024"

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }

# Workspace
tokio = { workspace = true, features = ["io-util"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hotpath = { workspace = true, optional = true }

hex = { version = "0.4.3", features = ["serde"] }
tokio-util = { version = "0.7.18" }
bincode = "1.3.3"
async-trait = "0.1.86"
zstd = { version = "0.13.3", optional = true }


# No optional dependencies here, they moved to lanforge-http and lanforge-dns

[features]
adblock = ["lanforge-core/adblock", "lanforge-dns/adblock"]
default = []
zstd = ["dep:zstd"]
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
