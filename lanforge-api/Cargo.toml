[package]
name = "lanforge-api"
version = "0.10.1"
edition = "2024"

[dependencies]
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }

hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio = { version = "1", features = ["io-util"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
serde_json = "1.0.149"
thiserror = "2.0.18"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tokio-util = { version = "0.7.18" }
bincode = "1.3.3"
zstd = { version = "0.13", optional = true }

[features]
zstd = ["dep:zstd"]
adblock = ["lanforge-core/adblock", "lanforge-dns/adblock"]
default = ["adblock"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
