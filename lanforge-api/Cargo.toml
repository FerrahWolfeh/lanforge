[package]
name = "lanforge-api"
version = "0.10.1"
edition = "2024"

[dependencies]
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }

hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio = { version = "1", features = ["io-util"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio-util = { version = "0.7.18" }
bincode = "1.3.3"
async-trait = "0.1.86"
rand = { version = "0.8.6" }


# Optional dependencies for the Remote HTTP API
axum = { version = "0.8.8", features = ["ws"], optional = true }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"], optional = true }
argon2 = { version = "0.5.3", optional = true }
jsonwebtoken = { version = "10.3.0", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
rustls = { version = "0.23", optional = true, features = ["ring", "std"] }
rustls-pki-types = { version = "1.9", features = ["std"], optional = true }
futures = { version = "0.3.31", optional = true }
zstd = { version = "0.13", optional = true }
getrandom = { version = "0.4.2", optional = true }
axum-server = { version = "0.8.0", optional = true, features = [
    "rustls",
    "tls-rustls",
] }
base64 = { version = "0.22.1", optional = true }

[features]
zstd = ["dep:zstd"]
adblock = ["lanforge-core/adblock", "lanforge-dns/adblock"]

# Infrastructure features
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]
http = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:jsonwebtoken",
    "dep:futures",
]

# Protocol features
https = ["http", "tls", "dep:axum-server"]
doh = ["https", "dep:base64"]
dot = ["tls"]

default = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
