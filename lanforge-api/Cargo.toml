[package]
name = "lanforge-api"
version = "0.10.1"
edition = "2024"

[dependencies]
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }

hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio = { version = "1", features = ["io-util"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio-util = { version = "0.7.18" }
bincode = "1.3.3"
rand = "0.8.5"
async-trait = "0.1.86"

# Optional dependencies for the Remote HTTP API
axum = { version = "0.8.8", features = ["ws"], optional = true }
tower-http = { version = "0.6.8", features = [
    "cors",
    "trace",
], optional = true }
argon2 = { version = "0.5.3", optional = true }
jsonwebtoken = { version = "10.3.0", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
futures = { version = "0.3.31", optional = true }
zstd = { version = "0.13", optional = true }

[features]
zstd = ["dep:zstd"]
adblock = ["lanforge-core/adblock", "lanforge-dns/adblock"]
http = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:jsonwebtoken",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:futures",
]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
