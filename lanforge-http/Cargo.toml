[package]
name = "lanforge-http"
version = "0.1.0"
license.workspace = true
edition = "2024"

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-api = { path = "../lanforge-api" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-macros = { path = "../lanforge-macros" }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json"], optional = true }
chrono = { workspace = true }
futures = { workspace = true, optional = true }

# Server dependencies
axum = { version = "0.8.8", features = ["ws"], optional = true }
tower-http = { version = "0.6.8", features = [
    "cors",
    "fs",
    "trace",
], optional = true }
argon2 = { version = "0.5.3", optional = true }
jsonwebtoken = { version = "10.3.0", optional = true, default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
axum-server = { version = "0.8.0", optional = true, features = [
    "rustls",
    "tls-rustls",
] }
url = { version = "2.5.4", optional = true }
async-trait = "0.1.86"
base64 = { version = "0.22.1", optional = true }
rand = "0.10.1"

# Client dependencies
rustls = { workspace = true, optional = true }

[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:tower-http",
    "dep:argon2",
    "dep:jsonwebtoken",
    "dep:axum-server",
    "dep:futures",
    "lanforge-dns/dot",
    "dep:rustls",
]
remote = ["dep:reqwest", "dep:url"]
doh = ["server", "dep:base64"]

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { workspace = true, features = ["json"] }
