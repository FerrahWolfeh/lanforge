[package]
name = "lanforge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lanforge-dns-wire = { path = "../crates/net/lanforge-dns-wire" }
lanforge-types = { path = "../crates/core/lanforge-types" }
lanforge-dhcp = { path = "../crates/net/lanforge-dhcp" }
lanforge-core = { path = "../crates/core/lanforge-core" }
lanforge-dns = { path = "../crates/net/lanforge-dns" }
lanforge-pppoe = { path = "../crates/net/lanforge-pppoe" }
lanforge-tftp = { path = "../crates/net/lanforge-tftp" }
lanforge-ra = { path = "../crates/net/lanforge-ra" }
lanforge-api = { path = "../crates/api/lanforge-api" }
dhcproto = "0.15.0"
arbitrary = { version = "1.4.2", features = ["derive"] }
bytes = "1.12.1"
dashmap = "6.1.0"
smallvec = "1.16"
postcard = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "fuzz_dns_wire"
path = "fuzz_targets/fuzz_dns_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_roundtrip"
path = "fuzz_targets/fuzz_dns_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_cache"
path = "fuzz_targets/fuzz_dns_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_adblock"
path = "fuzz_targets/fuzz_dns_adblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dhcp_server"
path = "fuzz_targets/fuzz_dhcp_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dhcpv6_server"
path = "fuzz_targets/fuzz_dhcpv6_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_identifiers"
path = "fuzz_targets/fuzz_identifiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pppoe"
path = "fuzz_targets/fuzz_pppoe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tftp"
path = "fuzz_targets/fuzz_tftp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_api_framing"
path = "fuzz_targets/fuzz_api_framing.rs"
test = false
doc = false
bench = false

[workspace]
