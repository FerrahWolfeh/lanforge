# Lanforge Static Device Reservations
# Manually define hostnames, fixed IPs, and specific boot files.

[[devices]]
# MAC Address of the device (Required)
mac = "00:11:22:33:44:55"
# Friendly name for DNS resolution
hostname = "gateway"
# Fixed IPv4 address (must be outside the dynamic pool)
v4_ip = "192.168.1.1"
# Fixed DHCPv6 suffix (applies to both ULA and GUA)
v6_suffix = "::1"
# Per-device network boot file override
boot_file = "custom-grub.efi"

[[devices]]
mac = "aa:bb:cc:dd:ee:ff"
hostname = "server"
v4_ip = "192.168.1.10"
