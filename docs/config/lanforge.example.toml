# Lanforge Master Reference Configuration
# Version: 0.27.0
# This file documents all available sections and options.

[system]
# LAN interface where the daemon listens for all services.
iface = "end0"
# Target IPv6 SLAAC prefix used by the NDP (Neighbor Discovery Protocol) engine to track and
# associate IPv6 SLAAC addresses with local LAN devices (e.g., "fd00:abcd:1234:1::/64").
# If left empty (""), Lanforge automatically generates a unique RFC 4193-compliant random ULA prefix on first launch.
target_prefix = ""
# Global search domains used by DHCPv4, DHCPv6, and RA.
search_domains = ["lan", "home.arpa"]
# Wait time before processing network events (prevents flapping).
debounce_secs = 2
# Global TLS certificate and key (inherited by DNS and HTTP).
# tls_cert = "/etc/lanforge/certs/lanforge.crt"
# tls_key = "/etc/lanforge/certs/lanforge.key"

[database]
# Persistent configuration database (services, users, static hosts, DNS rewrites):
config_path = "/var/lib/lanforge/config.redb"
# Volatile runtime database in tmpfs (active leases, query logs, system event history):
runtime_path = "/run/lanforge/runtime.redb"
# How often to flush in-memory state to disk/database (seconds).
flush_interval_secs = 5

[api]
# Enable the Unix Domain Socket control API.
enabled = true
# Path to the control socket.
socket_path = "/run/lanforge/control.sock"
# Optional TCP port for remote debugging (not recommended for production).
# tcp_port = 50051

[http]
# Enable the REST API, Web Console, and Prometheus metrics exporter.
enabled = true
# Listen address for the HTTP service (dual-stack wildcard [::]:8088 covers IPv6 and IPv4).
listen = "[::]:8088"
# Enable HTTPS (inherits global system TLS if paths are omitted).
https_enabled = false
# Whether plaintext HTTP is explicitly allowed (for local development only).
allow_plaintext_http = true
# Enable DNS-over-HTTPS (DoH).
doh_enabled = false
# tls_cert = "/etc/lanforge/certs/http.crt"
# tls_key = "/etc/lanforge/certs/http.key"

# Secure hash of the API password (Argon2 or similar).
# auth_password_hash = "$argon2id$..."
# Directory for serving PXE/boot files over HTTP.
# boot_dir = "/var/lib/lanforge/tftp"

[ra]
# Enable Router Advertisements (IPv6).
enabled = true
# M-flag: Clients should use DHCPv6 for address assignment.
managed = true
# O-flag: Clients should use DHCPv6 for options (DNS, etc.).
other_config = true
# Suggested hop limit for clients' unicast traffic (default: 64, 0 = unspecified).
# hop_limit = 64
# Maximum interval between advertisements (seconds).
max_interval = 200
# Advertisement lifetime (seconds). 0 = not a default gateway.
# lifetime = 600

# Prefix Information Option (PIO)
[[ra.prefix]]
source = "ula"
address = "fd97:f00d:cafe:3731::"
on_link = true
autonomous = true

[[ra.prefix]]
source = "auto_gua" # Dynamically detects GUA from interface

# Recursive DNS Server (RDNSS)
[[ra.rdnss]]
servers = ["fd97:f00d:cafe:3731::1"]
lifetime = 600

# DNS Search List (DNSSL)
[[ra.dnssl]]
domains = ["lan"]
lifetime = 600

[dhcp.v4]
enabled = true
lease_time = 86400
# Default gateway announced to clients.
router = "192.168.1.1"
# DNS servers announced to clients.
dns = ["192.168.1.1"]
# Subnet mask (Option 1).
subnet_mask = "255.255.255.0"
# --- Network Boot (PXE/HTTP) ---
# For traditional PXE (BIOS/UEFI), this is the filename (Option 67).
# For UEFI HTTP Boot, this is auto-expanded to http://[server_ip]/boot/filename
# and served alongside Option 60 = "HTTPClient".
# boot_file = "ipxe.efi"

# TFTP server for traditional PXE boot (Option 66). Defaults to server_id if unset.
# tftp_server = "192.168.1.1"

# Address pools for dynamic assignment.
[[dhcp.v4.pools]]
range_start = "192.168.1.100"
range_end = "192.168.1.250"

# Custom DHCPv4 options using typed prefixes:
# - 's:' or 'ascii:' for strings
# - 'ip:' for IPv4/IPv6 addresses
# - 'hex:' for raw hex bytes (default)
# [dhcp.v4.options]
# 42 = "ip:192.168.1.1"    # NTP Server (Option 42)
# 114 = "s:http://captive" # Captive Portal (Option 114)

[dhcp.v6]
enabled = true
lease_time = 86400
# DNS servers (Option 23).
dns_servers = ["fd97:f00d:cafe:3731::1"]
# Search domains (Option 24).
search_domains = ["lan"]

# HTTP Boot file (Option 59).
# If a filename is provided, it's auto-expanded to http://[server_ip]:8088/boot/filename
# If a full URL (http://...) is provided, it's used as-is.
# boot_file = "ipxe.efi"

# Custom DHCPv6 options (same typed prefixes as v4)
# [dhcp.v6.options]
# 7 = "ip:fd97:f00d:cafe::1" # Log Server

[[dhcp.v6.pools]]
# Pool based on suffixes (applies to both ULA and GUA).
range_start = "::100"
range_end = "::1fff"

[dns]
enabled = true
# Standard DNS listen address (dual-stack UDP/TCP, or array of addrs).
listen = "[::]:53"
# Default TTL for local records.
ttl = 60
# Days to hide inactive devices from DNS.
last_seen_threshold_days = 7

# DNS-over-TLS (DoT)
dot_enabled = false
dot_listen = "0.0.0.0:853"
# tls_cert = "/etc/lanforge/certs/dns.crt"
# tls_key = "/etc/lanforge/certs/dns.key"

# DNS-over-QUIC (DoQ)
doq_enabled = false
doq_listen = "0.0.0.0:853"

# Note: Operational configurations like Upstream Resolvers, DNS Rewrites,
# and Adblock settings (enable toggle, blocklist URLs, blocking mode, allowlist, etc.)
# have been migrated to the database. Configure them dynamically at runtime
# using the CLI (`lanforge dns ...`) or the HTTP/UDS API.

[mdns]
# Actively probe for hostnames and device classes via mDNS.
enabled = true
probe_interval = 3600

[monitor]
enabled = true
# Pacing between probes during a network scan (ms).
scan_pacing_ms = 100
# How long to wait before marking a neighbor as stale (seconds).
stale_timeout_secs = 3600

[tftp]
enabled = true
# Root directory for PXE boot files.
root_dir = "/var/lib/lanforge/tftp"
listen_addr = "[::]:69"

[pppoe]
# Integrated PPPoE client service for direct WAN broadband dial-in.
enabled = false
wan_iface = "eth1"
username = "user@isp.com"
password = "secretpassword"
auth = "chap_md5"
mru = 1492

[pppoe.nftables]
enabled = true
table_name = "lanforge"
flow_offload = true
mss_clamping = true
masquerade = true
