# Lanforge reference configuration (/etc/lanforge/lanforge.toml).
#
# This file is the configuration: the CLI, the API and the WebUI write their changes here, and
# `lanforge reload` applies edits made by hand without restarting the daemon. A wrong value is
# left out and reported (`lanforge status`, WebUI), never guessed; a section that cannot be read
# is set aside and keeps running as it was. Every key below is optional unless marked.
# Durations take seconds or a unit: "30s", "10m", "4h", "1d".

[system]
# LAN interface where the daemon serves DHCP, RA and DNS.
iface = "end0"
# Search domains announced by DHCPv4, DHCPv6 and RA; `lan` is always added.
search_domains = ["lan", "home.arpa"]
# The LAN's IPv6 addresses (ULA, GUA) are the interface's own (systemd-networkd, DHCPv6-PD):
# lanforge detects them and never assigns addresses.
# TLS certificate and key shared by DNS-over-TLS/QUIC and HTTPS.
# tls_cert = "/etc/lanforge/certs/lanforge.crt"
# tls_key = "/etc/lanforge/certs/lanforge.key"

[database]
# State only (devices, leases, users, statistics): configuration lives in this file.
config_path = "/var/lib/lanforge/config.redb"
# Volatile data in tmpfs (query log, event history).
runtime_path = "/run/lanforge/runtime.redb"
# How often state in memory is written to disk.
flush_interval = "5s"

[api]
# The Unix socket the `lanforge` CLI talks to.
enabled = true
socket_path = "/run/lanforge/control.sock"

[http]
# REST API, WebUI and Prometheus metrics.
enabled = true
listen = "[::]:8088"
https_enabled = false
allow_plaintext_http = true
# DNS-over-HTTPS on the same listener.
doh_enabled = false

[dns]
enabled = true
# One address or several, comma-separated.
listen = "[::]:53"
# sequential, parallel, fastest or roundrobin.
upstream_mode = "sequential"

[dns.upstreams.cloudflare]
addresses = ["udp://1.1.1.1:53", "udp://[2606:4700:4700::1111]:53"]

# A group with `domain` only answers that domain (conditional forwarding).
# [dns.upstreams.corp]
# addresses = ["udp://10.0.0.1:53"]
# domain = "corp.example"

# PTR queries for a subnet go to its resolver.
# [dns.reverse]
# "10.0.0.0/8" = "udp://10.0.0.1:53"

[dns.rewrites]
# A fixed answer, or `dev:<name|mac>`: the device's current addresses.
"router.lan" = "192.168.1.1"
"files.lan" = "dev:nas"

[adblock]
enabled = true
# nxdomain, null_ip, custom_ip or refused.
blocking_mode = "nxdomain"
# Daily list update, local time.
refresh_time = "03:00"
# The global layer: lists and a rules file every client gets.
lists = ["stevenblack"]
# Manual rules, one per line: `||ads.example^` blocks, `@@||bank.example^` allows.
# Relative to this file's directory.
rules = "adblock/global.rules"
# Clients never filtered: a subnet, an address, or `dev:<name|mac>`.
bypass = ["dev:work-laptop"]

[adblock.sources.stevenblack]
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"

[adblock.sources.nsfw]
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts"

# Groups override the global layer for their clients: their rules and lists decide first
# (a group allow wins over a global block), then the global layer. `dev:<name>` follows the
# device's name whatever MAC it has (randomized Android MACs).
[adblock.groups.banking]
rules = "adblock/banking.rules"
clients = ["dev:my-phone"]

[adblock.groups.kids]
lists = ["nsfw"]
clients = ["192.168.1.64/28", "dev:tablet"]

[dhcp.v4]
enabled = true
lease = "1d"
router = "192.168.1.1"
dns = ["192.168.1.1"]
subnet_mask = "255.255.255.0"
# Absent: public NTP servers; `ntp = []` announces none.
# ntp = ["192.168.1.1"]
# Network boot: the file name (PXE, option 67) and its TFTP server (option 66).
# boot_file = "ipxe.efi"
# tftp_server = "192.168.1.1"
# Raw options by code, with a type prefix (`s:` text, `ip:` address, `hex:` bytes).
# options = { "114" = "s:http://captive.lan" }

[dhcp.v4.pools.main]
range = "192.168.1.100-192.168.1.250"

[dhcp.v6]
enabled = true
lease = "1d"
# Absent: this router's own LAN address.
# dns = ["fd00::1"]

# A suffix range follows the LAN prefix, whatever the ISP delegates.
[dhcp.v6.pools.main]
range = "::100-::1fff"

[ra]
enabled = true
# M flag: addresses from DHCPv6. O flag: other settings from DHCPv6.
managed = true
other_config = true
max_interval = "200s"
# Absent: the interface's ULA and delegated GUA prefixes, and RDNSS/DNSSL from DHCPv6 and the
# search domains. A prefix written here replaces them.
# [ra.prefixes.lan]
# source = "auto_gua"

[firewall]
enabled = true
default_input_policy = "drop"
default_forward_policy = "drop"

[firewall.zones.external]
interfaces = ["wan0"]
input = "drop"
forward = "drop"
masquerade = true
mtu_fix = true

[firewall.zones.internal]
interfaces = ["lan0"]
input = "accept"
forward = "accept"
open_ports = ["53/udp", "53/tcp", "67/udp", "8088/tcp"]

# WAN to a LAN host; `to` takes an address or `dev:<name|mac>`.
[firewall.port_forwards.torrent]
proto = "tcp"
port = 6881
to = "dev:nas"

[pppoe]
# PPPoE WAN client (the WAN interface becomes ppp0).
enabled = false
wan_iface = "eth1"
username = "user@isp.example"
password = "secret"
# none, pap or chap_md5.
auth = "chap_md5"
mru = 1492

# Static hosts: the table name is the hostname.
[hosts.nas]
mac = "02:00:00:00:05:01"
v4 = "192.168.1.10"
# A suffix follows the LAN prefix; a full address is fixed.
v6_suffix = "::10"

[mdns]
# Probe devices for their names over mDNS.
enabled = true
probe_interval = "1h"

[monitor]
enabled = true
scan_pacing_ms = 100
stale_timeout_secs = 3600

[tftp]
enabled = false
listen = "[::]:69"
root_dir = "/var/lib/lanforge/tftp"
