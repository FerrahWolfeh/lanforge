# Lanforge DNS Configuration
# Features: Zero-allocation wire parser, prioritized failover upstreams, adblocker.

[dns]
enabled = true
listen = "0.0.0.0:53"

# Multiple search domains for local resolution.
search_domains = ["lan", "local"]

# --- Operational Data (Upstreams, Adblock, Rewrites) ---
# Note: Upstream resolvers, Adblock settings (enable toggle, lists, redirect IPs),
# and Domain rewrites have been migrated to the database for dynamic, runtime management.
#
# DO NOT configure them here. Instead, use the `lanforge` command-line tool:
#
# 1. Upstream Servers:
#    lanforge dns upstream add udp://8.8.8.8:53
#    lanforge dns upstream add tls://1.1.1.1:853
#
# 2. DNS Rewrites:
#    lanforge dns rewrite add router.lan 192.168.1.1
#    lanforge dns rewrite add vault.lan dev:truenas
#
# 3. Adblock Settings:
#    lanforge dns adblock config --mode null_ip
#    lanforge dns adblock url add https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
#    lanforge dns adblock enable

# How many days a device can be offline before its DNS entry is hidden.
last_seen_threshold_days = 7

# Default TTL for local records (seconds).
ttl = 60

# --- DNS-over-TLS (DoT) ---
# RFC 7766 compliant DNS over TLS. Requires 'dot' feature.
dot_enabled = true
dot_listen = "0.0.0.0:853"
# tls_cert = "/etc/lanforge/certs/dns.crt" # Optional override
# tls_key = "/etc/lanforge/certs/dns.key"  # Optional override

# --- DNS-over-QUIC (DoQ) ---
# RFC 9250 compliant DNS over QUIC. Requires 'doq' feature.
doq_enabled = false
doq_listen = "0.0.0.0:853"
# Both DoT and DoQ share the same tls_cert and tls_key.

# --- Query Logging ---
# Tracks query outcomes and provides metrics for the CLI/UI.
[dns.query_log]
enabled = true
ring_size = 1000
persist = false       # If true, queries are saved to the long-term DB
retention_hours = 168 # 7 days

# --- Cache ---
# Maximum number of entries in the DNS cache.
cache_size = 10000
# Minimum TTL for cached records (seconds).
cache_min_ttl = 30
