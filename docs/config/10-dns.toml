# Lanforge DNS: local names, upstream forwarding, rewrites. Adblock is `[adblock]` (see
# lanforge.example.toml).

[dns]
enabled = true
# One address or several, comma-separated.
listen = "[::]:53"
# sequential (in order, next on failure), parallel, fastest or roundrobin.
upstream_mode = "sequential"

# Upstream resolvers, grouped by name: udp://, tcp://, tls:// (DoT), https:// (DoH), quic:// (DoQ).
[dns.upstreams.cloudflare]
addresses = ["tls://one.one.one.one@1.1.1.1:853", "udp://[2606:4700:4700::1111]:53"]

# A group with `domain` only answers that domain (conditional forwarding).
[dns.upstreams.corp]
addresses = ["udp://10.0.0.1:53"]
domain = "corp.example"

# PTR queries for a subnet go to its resolver.
[dns.reverse]
"10.0.0.0/8" = "udp://10.0.0.1:53"

# A fixed answer, a list tried in order, or `dev:<name|mac>`: the device's current addresses.
[dns.rewrites]
"router.lan" = "192.168.1.1"
"files.lan" = "dev:nas"
"*.apps.lan" = "dev:aa:bb:cc:dd:ee:ff"
