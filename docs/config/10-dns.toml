# Lanforge DNS Configuration
# Features: Zero-allocation wire parser, prioritized failover upstreams, adblocker.

[dns]
enabled = true
listen = "0.0.0.0:53"

# Multiple search domains for local resolution.
search_domains = ["lan", "local"]

# --- MODE 1: Recursive Forwarder (with prioritized upstreams) ---
# Format: { target = "proto://ip:port", priority = number } (Lower priority is tried first)
[[dns.upstreams]]
target = "tls://1.1.1.1:853"
priority = 10

[[dns.upstreams]]
target = "udp://8.8.8.8:53"
priority = 20

# --- MODE 2: Authoritative Only ---
# To disable forwarding and only resolve local names, leave [[dns.upstreams]] empty.
# upstreams = []

# --- Adblocker (Requires 'adblock' feature) ---
adblock_enabled = true
adblock_urls = [
    "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
    "https://adaway.org/hosts.txt",
]

# Blocking mode: "nxdomain" (default), "null_ip" (0.0.0.0), "custom_ip", "refused"
blocking_mode = "nxdomain"

# These two only work on blocking_mode = "custom_ip"
blocking_ip_v4 = "192.168.1.5"
blocking_ip_v6 = "::1"

# Domains to always allow regardless of blocklists (supports exact match and parent-domain walk)
allowlist = ["google.com", "my-safe-site.lan"]

# --- DNS Rewrites ---
# Manually redirect domains to specific IPs or other domains.
# Format: A table with 'domain' and 'answer' fields.
# Answer can be an IPv4, IPv6, CNAME, or "dev:<hostname>" to map to a device's current IP.
[[dns.rewrites]]
domain = "router.lan"
answer = "192.168.1.1"

[[dns.rewrites]]
domain = "vault.lan"
answer = "dev:truenas"

[[dns.rewrites]]
domain = "google.com"
answer = "forcesafesearch.google.com"

# How many days a device can be offline before its DNS entry is hidden.
last_seen_threshold_days = 7

# Default TTL for local records (seconds).
ttl = 60

# --- DNS-over-TLS (DoT) ---
# RFC 7766 compliant DNS over TLS. Requires 'dot' feature.
dot_enabled = true
dot_listen = "0.0.0.0:853"
# tls_cert = "/etc/lanforge/certs/dns.crt" # Optional override
# tls_key = "/etc/lanforge/certs/dns.key"  # Optional override

# --- DNS-over-QUIC (DoQ) ---
# RFC 9250 compliant DNS over QUIC. Requires 'doq' feature.
doq_enabled = false
doq_listen = "0.0.0.0:853"
# Both DoT and DoQ share the same tls_cert and tls_key.

# --- Query Logging ---
# Tracks query outcomes and provides metrics for the CLI/UI.
[dns.query_log]
enabled = true
ring_size = 1000
persist = false      # If true, queries are saved to the long-term DB
retention_hours = 168 # 7 days
