# Lanforge IPv6 Router Advertisements (RFC 4861).
#
# Left out, the prefixes are the LAN interface's own ULA and delegated GUA, and RDNSS/DNSSL
# follow DHCPv6 and the search domains: most setups need only `enabled`.

[ra]
enabled = true
# M flag: addresses from DHCPv6. O flag: other settings (DNS, ...) from DHCPv6.
managed = true
other_config = true
# Durations: seconds or "200s", "10m", "1d".
max_interval = "10m"
# Router lifetime; 0 = not a default router.
lifetime = "30m"
mtu = 1500
hop_limit = 64

# A prefix written here replaces the detected ones. `source`: static, ula, auto_ula or
# auto_gua (found on the interface at run time).
[ra.prefixes.gua]
source = "auto_gua"

[ra.prefixes.ula]
source = "auto_ula"

[ra.rdnss.lan]
servers = ["fd00:cafe:f00d::1"]
lifetime = "10m"

[ra.dnssl.lan]
domains = ["lan"]
lifetime = "10m"
