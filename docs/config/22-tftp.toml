# Lanforge TFTP Configuration
# Lightweight TFTP server specifically for PXE/Network boot orchestration.

[tftp]
enabled = true

# The directory to serve files from.
root_dir = "/var/lib/lanforge/tftp"

# Address and UDP port to listen on (Default: "0.0.0.0:69").
listen_addr = "0.0.0.0:69"

# Default block size for transfers in bytes (Default: 512).
# block_size = 512

# Timeout for retransmissions in seconds (Default: 5).
# timeout = 5

# Maximum number of retries per block (Default: 3).
# max_retries = 3
