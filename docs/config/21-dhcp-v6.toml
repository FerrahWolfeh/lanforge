# Lanforge DHCPv6 (IA_NA addresses).

[dhcp.v6]
enabled = true
lease = "1d"
# Absent: this router's own LAN address.
dns = ["fd00::1"]
# HTTP boot (option 59): a file name is served from this router, a URL is used as is.
# boot_file = "ipxe.efi"

# Suffix ranges follow the LAN prefix, whatever the ISP delegates; a full address is fixed.
[dhcp.v6.pools.main]
range = "::100-::ffff"
