# Lanforge API & HTTP Configuration
# These are independent modules in the new architecture.

[api]
# Local CLI control via Unix Socket.
enabled = true
socket_path = "/run/lanforge/control.sock"

# Optional TCP port for the control API (debug).
# tcp_port = 50051

[http]
# REST API and Prometheus metrics exporter.
enabled = true
listen = "[::]:8088"

# Secure the API with HTTPS (inherits global system TLS from [system] if paths are omitted).
https_enabled = true

# Whether plaintext HTTP is explicitly allowed (for local development only).
# allow_plaintext_http = false

# DNS-over-HTTPS (DoH)
doh_enabled = true

# Optional overrides for HTTP-specific TLS certificate and key (defaults to system TLS):
# tls_cert = "/etc/lanforge/cert.pem"
# tls_key = "/etc/lanforge/key.pem"

# Directory for serving PXE/boot files over HTTP.
# boot_dir = "/var/lib/lanforge/tftp"
