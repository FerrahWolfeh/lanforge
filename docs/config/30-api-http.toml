# Lanforge control socket and HTTP server.

[api]
# The Unix socket the `lanforge` CLI talks to.
enabled = true
socket_path = "/run/lanforge/control.sock"

[http]
# REST API, WebUI and Prometheus metrics.
enabled = true
listen = "[::]:8088"
# HTTPS with the `[system]` certificate and key.
https_enabled = true
# Plain HTTP next to HTTPS (local development).
allow_plaintext_http = false
# DNS-over-HTTPS on the same listener.
doh_enabled = true
