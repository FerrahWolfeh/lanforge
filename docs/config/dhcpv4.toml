# DHCPv4 Service Configuration Example

[dhcp.v4]
# Whether the DHCPv4 service is enabled.
enabled = true

# Dynamic address pool range.
range_start = "192.168.1.100"
range_end = "192.168.1.254"

# Default lease time (seconds). Default: 86400 (24h)
lease_time = 86400

# Default gateway (Router) announced to clients.
router = "192.168.1.1"

# DNS servers announced to clients.
dns = ["192.168.1.1"]

# Subnet mask. Default: 255.255.255.0
subnet_mask = "255.255.255.0"

# Network Boot (PXE) settings
# tftp_server = "192.168.1.1"
# boot_file = "pxelinux.0"
