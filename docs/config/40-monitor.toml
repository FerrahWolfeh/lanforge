# Lanforge network monitor: ARP/NDP scanning and stale device detection.

[monitor]
# Off saves memory but cripples discovery: IPv6 devices are not detected passively and
# devices that do not use DHCP never update their last-seen time.
enabled = true
# Pause between probes of a subnet scan (milliseconds).
scan_pacing_ms = 10
# A device not seen for this long is offline (seconds).
stale_timeout_secs = 3600
# Interfaces to watch; absent: the LAN interface.
# interfaces = ["lan0", "lan0.100"]
