# Lanforge System Configuration
# This file handles the core networking and persistence settings.

[system]
# Primary interface for all LAN operations.
iface = "end0"

# Global search domains used across DNS and DHCP modules.
search_domains = ["lan", "homelab.local"]

# Global TLS certificate and key (inherited by DNS and HTTP).
# tls_cert = "/etc/lanforge/certs/lanforge.crt"
# tls_key = "/etc/lanforge/certs/lanforge.key"

# IPv6 tracking prefix for local device identification.
target_prefix = "fd00:cafe:f00d::"

# Event bus debouncing (seconds) to prevent thrashing.
debounce_secs = 2

[database]
# Main persistence (PostgreSQL for production, or "memory" for in-memory mode).
url = "postgres://lanforge:lanforge@localhost:5432/lanforge"
# url = "memory"

# Transient log storage (JSONL file for query logs and audit metrics).
log_url = "/tmp/lanforge-logs.jsonl"

# Flushing interval for in-memory state persistence (seconds).
flush_interval = 60
