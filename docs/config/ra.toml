# Router Advertisement (RA) Service Configuration Example

[ra]
# Whether the RA service is enabled.
enabled = true

# M flag: Managed address configuration (clients use DHCPv6).
managed = false

# O flag: Other configuration (clients use DHCPv6 for DNS/options).
other_config = false

# MaxRtrAdvInterval: Maximum time between periodic RAs (seconds).
# Range: [4, 1800]. Default: 200
max_interval = 200

# Router lifetime (seconds). 0 means not a default gateway.
# Range: [max_interval, 9000]. Default: 3 * max_interval
router_lifetime = 600

# MTU to announce. IPv6 minimum is 1280.
# mtu = 1492

# IPv6 prefixes to advertise
[[ra.prefix]]
# Source: "ula" (static) or "auto_gua" (detected from interface)
source = "ula"
address = "fd00::/64"
on_link = true
autonomous = true
valid_lifetime = "24h" # or "infinity" or seconds (e.g. 86400)
preferred_lifetime = "4h"

# DNS Servers via RDNSS
[[ra.rdnss]]
servers = ["fd00::1"]
# lifetime = 600
