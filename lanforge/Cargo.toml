[package]
name = "lanforge"
version = "0.13.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lanforged"
path = "src/main.rs"

[features]
default = ["sqlite"]
debug-commands = []

# Profiling & Diagnostics
hotpath = [
    "dep:hotpath",
    "hotpath/hotpath",
    "hotpath/threads",
    "hotpath/tokio",
    "lanforge-core/hotpath",
    "lanforge-dns/hotpath",
    "lanforge-network/hotpath",
    "lanforge-db/hotpath",
]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
    "lanforge-dns/hotpath-alloc",
    "lanforge-network/hotpath-alloc",
    "lanforge-db/hotpath-alloc",
]
jemalloc = ["dep:tikv-jemallocator"]


# Database Backends
sqlite = ["lanforge-db/sqlite"]
postgres = ["lanforge-db/postgres"]

# Networking Protocols
http = ["dep:lanforge-http", "lanforge-http/server"]
https = ["dep:lanforge-http", "lanforge-http/server"]
doh = ["dep:lanforge-http", "lanforge-http/doh"]
dot = ["lanforge-dns/dot"]
doq = ["lanforge-dns/doq"]

# Core Features
adblock = ["lanforge-dns/adblock", "lanforge-db/adblock"]
zstd = ["lanforge-api/zstd"]

# Meta-features
full = ["http", "https", "doh", "dot", "doq", "adblock", "postgres", "sqlite"]


[dependencies]
# Lanforge
lanforge-types = { path = "../lanforge-types" }
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-network = { path = "../lanforge-network" }
lanforge-api = { path = "../lanforge-api" }
lanforge-http = { path = "../lanforge-http", optional = true }
lanforge-tftp = { path = "../lanforge-tftp" }


# Async & runtime
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
] }
futures = { workspace = true }

# CLI e config
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
toml = "1.1.2"

# Networking / netlink
netlink-sys = "0.8"
rtnetlink = "0.20"
pnet = "0.35.0"

# Observabilidade
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
hotpath = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }


[dev-dependencies]
tokio = { workspace = true, features = ["full", "io-util"] }
tempfile = "3.10.1"
serde_json = { workspace = true }
