[package]
name = "lanforge"
version = "0.13.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lanforged"
path = "src/main.rs"

[features]
default = ["sqlite"]
debug-commands = []
sqlite = ["lanforge-db/sqlite"]
postgres = ["lanforge-db/postgres"]
adblock = [
    "lanforge-dns/adblock",
    "lanforge-db/adblock",
]
http = ["lanforge-http/server"]
dot = ["lanforge-dns/dot"]
doq = ["lanforge-dns/doq"]
https = ["lanforge-http/server"]
doh = ["lanforge-http/doh"]
zstd = ["lanforge-api/zstd"]
full = [
    "http",
    "dot",
    "doq",
    "https",
    "doh",
    "adblock",
    "postgres",
    "sqlite",
]


[dependencies]
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-network = { path = "../lanforge-network" }
lanforge-api = { path = "../lanforge-api" }
lanforge-http = { path = "../lanforge-http", optional = true }

# Async & runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }

# CLI e config
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"

# Networking / netlink
netlink-sys = "0.8"
rtnetlink = "0.20"
pnet = "0.35.0"

# Observabilidade
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
lanforge-tftp = { version = "0.1.0", path = "../lanforge-tftp" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "io-util"] }
tempfile = "3.10.1"
serde_json = "1.0"
