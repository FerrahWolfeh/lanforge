[general]
iface_lan = "end0"
iface_wan = "ppp0"
leases_db = "/var/lib/lanforge/leases.db"

[ra]
enabled = true
managed = true
other_config = true
max_interval = 100
router_lifetime = 300
mtu = 1492            # PPPoE — anuncia MTU correto para clientes

[[ra.prefix]]
source = "ula"
address = "fd97:f00d:cafe:3731::"

[[ra.prefix]]
source = "auto_gua" # detecta da interface

[[ra.rdnss]]
servers = ["fd97:f00d:cafe:3731::1"]
lifetime = 600

[dhcp.v4]
enabled = true
range_start = "192.168.100.1"
range_end = "192.168.128.254"
lease_time = 86400
router = "192.168.254.1"
dns = ["192.168.254.1"]

[dhcp.v6]
enabled = true
lease_time = 86400
range_start = "fd97:f00d:cafe:3731::100"
range_end = "fd97:f00d:cafe:3731::1fff"

[dns]
enabled = true
listen = "0.0.0.0:5354"
upstream = "127.0.0.1:5335" # unbound
search_domain = "lan"

# Dispositivos estáticos — um bloco por dispositivo físico, ambas as stacks juntas.
# v4_ip e v6_suffix são opcionais: omitir significa sem reserva naquela família.
# v6_suffix é o sufixo host (/128) que compõe o ULA completo com o prefixo configurado.
[[devices]]
mac = "e0:d5:5e:e2:d4:89"
hostname = "Archie"
v4_ip = "192.168.0.2"
v6_suffix = "::1057:cafe" # → fd97:f00d:cafe:3731::1057:cafe
