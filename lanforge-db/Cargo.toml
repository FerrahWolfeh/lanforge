[package]
name = "lanforge-db"
version = "0.12.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres", "sqlx/mac_address", "sqlx/ipnetwork"]
adblock = ["lanforge-core/adblock"]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
hotpath = { workspace = true, optional = true }

# Third party
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }
futures.workspace = true


[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
