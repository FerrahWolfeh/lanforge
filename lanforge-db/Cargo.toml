[package]
name = "lanforge-db"
version = "0.5.0"
edition = "2024"

[features]
default = ["sqlite", "adblock"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
adblock = ["lanforge-core/adblock"]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "lanforge-core/hotpath-alloc"]

[dependencies]
hotpath = { workspace = true, optional = true }
# rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }

lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
tracing = "0.1.44"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
