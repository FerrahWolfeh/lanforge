[package]
name = "lanforge-db"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
lanforge-core = { path = "../lanforge-core" }
tracing = "0.1.44"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["sync", "time", "rt", "macros"] }
rusqlite_migration = "2.5.0"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
