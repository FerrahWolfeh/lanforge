[package]
name = "lanforge-db"
version = "0.5.0"
edition = "2024"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
# rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }

lanforge-core = { path = "../lanforge-core" }
tracing = "0.1.44"
thiserror = "2.0.18"
# rusqlite_migration = "2.5.0"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["sync", "time", "rt", "macros"] }
