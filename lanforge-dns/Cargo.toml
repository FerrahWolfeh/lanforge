[package]
name = "lanforge-dns"
version = "1.1.0"
edition = "2024"

[dependencies]
hickory-proto = { version = "0.26.1", default-features = false, features = [
    "std",
] }
moka = { version = "0.12.15", features = ["sync"] }
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
tokio = { version = "1.52.1", features = ["io-util", "net", "time", "rt"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
hotpath = { workspace = true, optional = true }

ureq = { version = "3.3.0", optional = true }
dashmap = { version = "6.1.0", optional = true }
parking_lot = "0.12.5"
socket2 = { version = "0.5.8", features = ["all"] }
rustls = { version = "0.23.22", optional = true, default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
tokio-rustls = { version = "0.26.1", optional = true }
webpki-roots = { version = "1.0.7", optional = true }
quinn = { version = "0.11.9", features = [
    "rustls",
    "runtime-tokio",
], optional = true }
smallvec = { version = "1.15.1", features = ["union", "const_generics", "serde"] }

[features]
adblock = ["dep:ureq", "dep:dashmap", "lanforge-core/adblock"]
dot = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
doq = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "lanforge-core/hotpath-alloc"]
default = []


[dev-dependencies]
tokio = { version = "1.50.0", features = ["io-util", "net", "rt", "time"] }
hickory-client = "0.25.2"

[lints.clippy]
nursery = "warn"
all = "warn"
pedantic = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
