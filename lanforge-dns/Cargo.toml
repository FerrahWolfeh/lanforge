[package]
name = "lanforge-dns"
version = "1.1.0"
edition = "2024"

[dependencies]
hickory-proto = { version = "0.26.0", default-features = false, features = [
    "std",
] }
moka = { version = "0.12.15", features = ["sync"] }
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
tokio = { version = "1.50.0", features = ["io-util", "net", "time", "rt"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
ureq = { version = "3.3.0", optional = true }
dashmap = { version = "6.1.0", optional = true }
parking_lot = "0.12.5"
rustls = { version = "0.23.22", optional = true, features = ["ring", "std"] }
rustls-pki-types = { version = "1.11.0", features = ["std"], optional = true }
tokio-rustls = { version = "0.26.1", optional = true }
webpki-roots = { version = "1.0.7", optional = true }
quinn = { version = "0.11.9", features = [
    "rustls",
    "runtime-tokio",
], optional = true }

[features]
adblock = ["dep:ureq", "dep:dashmap", "lanforge-core/adblock"]
dot = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
doq = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
default = []

[dev-dependencies]
tokio = { version = "1.50.0", features = ["io-util", "net", "rt", "time"] }

[lints.clippy]
nursery = "warn"
all = "warn"
pedantic = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
