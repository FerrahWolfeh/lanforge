[package]
name = "lanforge-dns"
version = "1.1.0"
edition = "2024"

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }

# Workspace
tokio = { workspace = true, features = ["io-util", "net", "time", "rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
hotpath = { workspace = true, optional = true }
smallvec = { workspace = true }

# Third party
moka = { version = "0.12.15", features = ["sync"] }
hickory-proto = { version = "0.26.1", default-features = false, features = [
    "std",
] }
ureq = { version = "3.3.0", optional = true }
dashmap = { version = "6.1.0", optional = true }
parking_lot = "0.12.5"
socket2 = { version = "0.6.3", features = ["all"] }
rustls = { version = "0.23.22", optional = true, default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = { version = "1.14.1", features = ["std"], optional = true }
tokio-rustls = { version = "0.26.1", optional = true }
webpki-roots = { version = "1.0.7", optional = true }
quinn = { version = "0.11.9", features = [
    "rustls",
    "runtime-tokio",
], optional = true }
hyper = { version = "1.8.1", features = ["full"], optional = true }
hyper-util = { version = "0.1.13", features = ["full"], optional = true }
hyper-rustls = { version = "0.27.9", features = [
    "rustls-platform-verifier",
    "http2",
    "ring",
], optional = true }
http-body-util = { version = "0.1.3", optional = true }
base64 = { version = "0.22.1", optional = true }

[features]
adblock = ["dep:ureq", "dep:dashmap", "lanforge-core/adblock"]
dot = [
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
doq = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
doh-upstream = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:base64",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = ["adblock", "dot", "doq"]


[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
hickory-client = "0.25.2"
