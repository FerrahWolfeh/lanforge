[package]
name = "lanforge-dns"
version = "1.1.0"
edition = "2024"

[dependencies]
hickory-proto = { version = "0.25.2", default-features = false, features = [
    "std",
] }
moka = { version = "0.12.15", features = ["sync"] }
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
tokio = { version = "1.50.0", features = ["io-util", "net", "time", "rt"] }
tracing = "0.1.44"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
ureq = { version = "2.12.1", optional = true }
dashmap = { version = "6.1.0", optional = true }
parking_lot = "0.12.5"

[features]
adblock = ["dep:ureq", "dep:dashmap", "lanforge-core/adblock"]
default = ["adblock"]

[dev-dependencies]
tokio = { version = "1.50.0", features = ["io-util", "net", "rt", "time"] }
