[package]
name = "lanforge-cli"
version = "1.1.0"
edition = "2024"

[lib]
name = "lanforge_cli"
path = "src/lib.rs"

[[bin]]
name = "lanforge"
path = "src/main.rs"

[features]
default = ["sqlite", "zstd"]
sqlite = ["lanforge-db/sqlite"]
postgres = ["lanforge-db/postgres"]
zstd = ["lanforge-api/zstd", "dep:zstd"]

[dependencies]
bytesize = "2.3.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["cargo", "derive", "env"] }
color-eyre = "0.6.5"
colored = "3.1.1"
inquire = "0.9.4"
iocraft = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
lanforge-api = { path = "../lanforge-api" }
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
mac_oui = { version = "0.4.11", features = ["with-db"] }
bincode = "1.3.3"
zstd = { version = "0.13", optional = true }
duration-str = "0.21.0"
