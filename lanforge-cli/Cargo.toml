[package]
name = "lanforge-cli"
version = "1.1.0"
edition = "2024"

[lib]
name = "lanforge_cli"
path = "src/lib.rs"

[[bin]]
name = "lanforge"
path = "src/main.rs"

[features]
default = ["sqlite", "zstd", "tui", "remote"]
sqlite = ["lanforge-db/sqlite"]
postgres = ["lanforge-db/postgres"]
zstd = ["dep:zstd"]
remote = [
    "dep:lanforge-http",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:url",
    "dep:futures",
    "dep:http",
]
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-tree-widget"]

[dependencies]
bytesize = "2.3.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["cargo", "derive", "env"] }
color-eyre = "0.6.5"
colored = "3.1.1"
inquire = "0.9.4"
iocraft = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
lanforge-api = { path = "../lanforge-api" }
lanforge-http = { path = "../lanforge-http", features = [
    "remote",
], optional = true }
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-macros = { path = "../lanforge-macros" }
mac_oui = { version = "0.4.11", features = ["with-db"] }
bincode = "1.3.3"
zstd = { version = "0.13", optional = true }
duration-str = "0.21.0"
ratatui = { version = "0.30.0", features = ["crossterm"], optional = true }
crossterm = { version = "0.29.0", optional = true }
tui-tree-widget = { version = "0.24.0", optional = true }
reqwest = { version = "0.13.3", features = ["json", "rustls"], optional = true }
tokio-tungstenite = { version = "0.29.0", features = [
    "rustls-tls-webpki-roots",
], optional = true }
url = { version = "2.5.4", optional = true }
futures = { version = "0.3.31", optional = true }
http = { version = "1.2.0", optional = true }
