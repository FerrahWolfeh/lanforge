[package]
name = "lanforge-api-dispatch"
version = "0.30.0"
edition.workspace = true
authors.workspace = true

[dependencies]
lanforge-types = { path = "../lanforge-types" }
lanforge-core = { path = "../lanforge-core" }
lanforge-db = { path = "../lanforge-db" }
lanforge-api = { path = "../lanforge-api" }
lanforge-dns = { path = "../lanforge-dns" }
lanforge-dns-wire = { path = "../lanforge-dns-wire" }
lanforge-macros = { path = "../lanforge-macros" }

tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
serde = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1.86"
serde_json = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rand = "0.10.1"
hex = "0.4.3"
hotpath = { workspace = true, optional = true }

[features]
adblock = [
    "lanforge-types/adblock",
    "lanforge-core/adblock",
    "lanforge-db/adblock",
    "lanforge-dns/adblock",
    "lanforge-api/adblock",
]
zstd = []
hotpath = [
    "dep:hotpath",
    "lanforge-core/hotpath",
    "lanforge-db/hotpath",
    "lanforge-dns/hotpath",
]

[dev-dependencies]
lanforge-dhcp = { path = "../lanforge-dhcp" }
