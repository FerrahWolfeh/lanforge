[package]
name = "lanforge-tftp"
version = "1.1.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }

# Workspace
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "macros",
    "sync",
    "fs",
    "time",
    "rt",
] }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
smallvec = { workspace = true }


# Third party
bytes = "1.11.1"
smol_str = "0.3.6"


[lints.clippy]
nursery = "warn"
all = "warn"
pedantic = "warn"
