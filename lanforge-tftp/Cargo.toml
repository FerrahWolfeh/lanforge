[package]
name = "lanforge-tftp"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
futures = "0.3.32"
lanforge-core = { version = "0.11.0", path = "../lanforge-core" }
lanforge-macros = { version = "0.1.0", path = "../lanforge-macros" }
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
smol_str = "0.3.6"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = [
    "net",
    "io-util",
    "macros",
    "sync",
    "fs",
    "time",
    "rt",
] }
tracing = "0.1.44"

[lints.clippy]
nursery = "warn"
all = "warn"
pedantic = "warn"
