[package]
name = "lanforge-tftp"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }

# Third party
bytes = "1.11.1"
futures = "0.3.32"
serde = { workspace = true, features = ["derive"] }
smallvec = "1.15.1"
smol_str = "0.3.6"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "macros",
    "sync",
    "fs",
    "time",
    "rt",
] }
tracing = { workspace = true }

[lints.clippy]
nursery = "warn"
all = "warn"
pedantic = "warn"
