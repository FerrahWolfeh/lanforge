[workspace]
members = [
    "lanforge",
    "lanforge-api",
    "lanforge-cli",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dns",
    "lanforge-http",
    "lanforge-macros",
    "lanforge-network",
    "lanforge-tftp",
    "lanforge-types",
]
resolver = "3"

[workspace.package]
license = "MPL-2.0"
edition = "2024"
version = "0.11.0"
authors = ["FerrahWolfeh"]

[workspace.dependencies]
hotpath = { version = "0.16", default-features = false }
tikv-jemallocator = { version = "0.6.1", features = ["profiling"] }
tokio = { version = "1.52.2" }
serde = { version = "1.0.228", features = ["derive"] }
tracing = { version = "0.1.44" }
thiserror = { version = "2.0.18" }
reqwest = { version = "0.13.3" }
serde_json = { version = "1.0.149" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
smallvec = { version = "1.15.1", features = [
    "union",
    "const_generics",
    "serde",
] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false
