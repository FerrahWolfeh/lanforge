[package]
name = "lanforge"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }

# CLI e config
clap = { version = "4.6.0", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"

# Networking / netlink
netlink-packet-core = "0.8"
netlink-packet-route = "0.28"
netlink-sys = "0.8"
rtnetlink = "0.20"

# Raw sockets (RA)
socket2 = { version = "0.6.3", features = ["all"] }
libc = "0.2.183"

# RNG (usa hardware RNG do BCM2711 via getrandom no RPi4)
rand = "0.10.0"

# Observabilidade
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
