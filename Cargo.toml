[workspace]
members = [
    "lanforge",
    "lanforge-api",
    "lanforge-api-dispatch",
    "lanforge-cli",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dhcp",
    "lanforge-dns",
    "lanforge-host",
    "lanforge-http",
    "lanforge-macros",
    "lanforge-ndp",
    "lanforge-probe",
    "lanforge-ra",
    "lanforge-dns-wire",
    "lanforge-tftp",
    "lanforge-types",
    "lanforge-uds",
    "lanforge-wol",
]
resolver = "3"

[workspace.package]
license = "MPL-2.0"
edition = "2024"
authors = ["Ferrah Aiko <ferrahwolfeh@proton.me>"]

[workspace.dependencies]
hotpath = { version = "0.16.1", default-features = false }
tikv-jemallocator = { version = "0.6.1", features = ["profiling"] }
tokio = { version = "1.52.3" }
serde = { version = "1.0.228", features = ["derive"] }
tracing = { version = "0.1.44" }
thiserror = { version = "2.0.18" }
reqwest = { version = "0.13.3" }
serde_json = { version = "1.0.149" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
smallvec = { version = "1.15.1", features = [
    "union",
    "const_generics",
    "serde",
] }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
rustls = { version = "0.23.40", default-features = false, features = [
    "aws-lc-rs",
    "std",
] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
parking_lot = { version = "0.12.5" }
tempfile = { version = "3.27.0" }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
strip = false

[profile.debug-release]
inherits = "release"
opt-level = 3
lto = "thin"
debug = true
strip = false
