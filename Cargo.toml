[workspace]
members = [
    "lanforge-api",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dns",
    "lanforge-network",
]

[package]
name = "lanforge"
version = "0.1.0"
edition = "2024"

[dependencies]
lanforge-core = { path = "lanforge-core" }
lanforge-db = { path = "lanforge-db" }
lanforge-dns = { path = "lanforge-dns" }
lanforge-network = { path = "lanforge-network" }
lanforge-api = { path = "lanforge-api" }

# Async & runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
    "rt-multi-thread",
] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }

# CLI e config
clap = { version = "4.6.0", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.0"

# Networking / netlink
netlink-sys = "0.8"
rtnetlink = "0.20"

# Observabilidade
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }

# Control
serde_json = "1.0.149"

# CLI
iocraft = "0.8.0"
tabled = "0.20.0"
chrono = { version = "0.4.44", features = ["serde"] }
inquire = "0.9.4"
colored = "3.1.1"
bytesize = "2.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false
