[workspace]
members = [
    "lanforge-api",
    "lanforge-cli",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dns",
    "lanforge-network",
]

[package]
name = "lanforge"
version = "0.12.0"
edition = "2024"

[features]
default = []
debug-commands = []

[dependencies]
lanforge-core = { path = "lanforge-core" }
lanforge-db = { path = "lanforge-db" }
lanforge-dns = { path = "lanforge-dns" }
lanforge-network = { path = "lanforge-network" }
lanforge-api = { path = "lanforge-api" }
lanforge-cli = { path = "lanforge-cli", optional = true }

# Async & runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "signal",
    "process",
    "time",
    "sync",
    "io-util",
] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }

# CLI e config
clap = { version = "4.6.0", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"

# Networking / netlink
netlink-sys = "0.8"
rtnetlink = "0.20"
pnet = "0.35.0"

# Observabilidade
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false

[dev-dependencies]
tokio = { version = "1", features = ["full", "io-util"] }
