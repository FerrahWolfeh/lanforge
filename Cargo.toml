[workspace]
members = [
    "lanforge",
    "lanforge-api",
    "lanforge-cli",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dns",
    "lanforge-macros",
    "lanforge-network",
]
resolver = "3"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false
