[workspace]
members = [
    "lanforge",
    "lanforge-api",
    "lanforge-cli",
    "lanforge-core",
    "lanforge-db",
    "lanforge-dns",
    "lanforge-http",
    "lanforge-macros",
    "lanforge-network",
    "lanforge-tftp",
    "lanforge-types",
]
resolver = "3"

[workspace.dependencies]
hotpath = { version = "0.15", default-features = false }
tikv-jemallocator = { version = "0.6", features = ["profiling"] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false
