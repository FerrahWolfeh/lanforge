[package]
name = "ipv6_namer"
version = "0.1.0"
edition = "2024"

[dependencies]
# Minimal tokio: only what we actually use (signal + macros for #[tokio::main])
tokio = { version = "1", features = ["macros", "rt", "signal", "process"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
netlink-packet-route = "0.28.0"
rtnetlink = "0.20.0"
anyhow = { version = "1.0", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
# clap for CLI args — small_vec feature keeps binary thin
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = "z"   # Optimise for size
lto = true        # Link-time optimisation
codegen-units = 1 # Single codegen unit → better LTO
strip = true      # Strip debug symbols
panic = "abort"   # Smaller panic handler
