[workspace]
members = [
    "crates/core/*",
    "crates/net/*",
    "crates/api/*",
    "crates/db/*",
    "crates/bin/*",
    "crates/webui/*",
]
resolver = "3"

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"
authors = ["Ferrah Aiko <ferrahwolfeh@proton.me>"]

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
# Google Rust Style Guide alignment
wildcard_imports = "warn"
unwrap_used = "warn"
clone_on_ref_ptr = "warn"
needless_borrow = "warn"
doc_markdown = "warn"

[workspace.dependencies]
# Actual lanforge stuff
lanforge-core = { path = "crates/core/lanforge-core" }
lanforge-macros = { path = "crates/core/lanforge-macros" }
lanforge-types = { path = "crates/core/lanforge-types" }
lanforge-crypto = { path = "crates/core/lanforge-crypto" }
lanforge-db = { path = "crates/db/lanforge-db" }
lanforge-db-core = { path = "crates/db/lanforge-db-core" }
lanforge-db-redb = { path = "crates/db/lanforge-db-redb" }
lanforge-api = { path = "crates/api/lanforge-api" }
lanforge-http = { path = "crates/api/lanforge-http", default-features = false }
lanforge-webui = { path = "crates/webui/lanforge-webui" }
lanforge-uds = { path = "crates/api/lanforge-uds" }
lanforge-cli = { path = "crates/bin/lanforge-cli" }
lanforge-discovery = { path = "crates/net/lanforge-discovery" }
lanforge-dns = { path = "crates/net/lanforge-dns" }
lanforge-dns-wire = { path = "crates/net/lanforge-dns-wire" }
lanforge-dhcp = { path = "crates/net/lanforge-dhcp" }
lanforge-ra = { path = "crates/net/lanforge-ra" }
lanforge-tftp = { path = "crates/net/lanforge-tftp" }
lanforge-pppoe = { path = "crates/net/lanforge-pppoe" }
lanforge-nft = { path = "crates/net/lanforge-nft" }
lanforge-traffic = { path = "crates/net/lanforge-traffic" }
lanforge-transport = { path = "crates/net/lanforge-transport" }
lanforge-api-dispatch = { path = "crates/api/lanforge-api-dispatch" }

# Third party
hotpath = { version = "0.28.6", default-features = false }
tikv-jemallocator = { version = "0.7.0", features = ["profiling"] }
tokio = { version = "1.53.3" }
serde = { version = "1.0.229", features = ["derive"] }
tracing = { version = "0.1.44" }
thiserror = { version = "2.0.21" }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
http-body-util = { version = "0.1.5" }
serde_json = { version = "1.0.154" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["cargo", "derive", "env"] }
smallvec = { version = "1.16.3", features = [
    "union",
    "const_generics",
    "serde",
] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = [
    "std",
    "logging",
    "tls12",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "logging",
    "tls12",
] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
redb = "4.4.0"
parking_lot = { version = "0.12.5" }
arc-swap = { version = "1.9.3" }
dashmap = { version = "6.1.0" }
tempfile = { version = "3.27.0" }
globset = "0.4.20"
rtnetlink = "0.23.0"
netlink-packet-core = "0.9.0"
netlink-sys = "0.9.0"
socket2 = { version = "0.6.5", features = ["all"] }
rand = "0.10.3"
libc = "0.2.191"
pnet = "0.35.0"
bytes = "1.12.1"
bytesize = "2.7.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
argon2 = { version = "0.6.0" }
password-hash = { version = "0.6.1" }
hex = "0.4.3"
base64 = "0.23.1"
toml = "1.1.8"
toml_edit = { version = "0.25", features = ["serde"] }
bitflags = "2.8"
sd-notify = "0.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.perf-release]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
strip = false

[profile.debug-release]
inherits = "release"
opt-level = 3
lto = "thin"
debug = true
strip = false
