[package]
name = "lanforge-core"
version = "0.11.0"
edition = "2024"

[dependencies]
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "sync"] }
tracing = "0.1.44"
argon2 = "0.5.3"
rand = "0.8.6"
hotpath = { workspace = true, optional = true }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }

smallvec = { version = "1.15.1", features = [
    "union",
    "const_generics",
    "serde",
] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "sync", "rt-multi-thread"] }

[features]
adblock = ["lanforge-types/adblock"]
hotpath = ["dep:hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
default = []
