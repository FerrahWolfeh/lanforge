[package]
name = "lanforge-core"
version = "0.11.0"
edition = "2024"

[dependencies]
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "sync"] }
tracing = "0.1.44"
mac_oui = { version = "0.4.11", features = ["with-db"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "sync", "rt-multi-thread"] }
