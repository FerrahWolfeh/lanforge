[package]
name = "lanforge-probe"
version = "1.0.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }
lanforge-dns-wire = { path = "../lanforge-dns-wire" }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "time",
    "net",
    "io-util",
    "macros",
    "sync",
] }
serde = { workspace = true }
tracing = { workspace = true }

# Third party
socket2 = "0.6.3"
pnet = "0.35.0"
hotpath = { workspace = true, optional = true }
libc = "0.2.186"

[features]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
