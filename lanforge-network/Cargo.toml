[package]
name = "lanforge-network"
version = "0.9.0"
edition = "2024"

[dependencies]
lanforge-core = { path = "../lanforge-core" }
dhcproto = "0.14.0"
netlink-packet-core = "0.8.1"
pnet = "0.35.0"
rtnetlink = "0.20.0"
netlink-sys = "0.8.8"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = [
    "time",
    "net",
    "io-util",
    "macros",
    "sync",
] }
tracing = "0.1.44"
socket2 = "0.6.3"
futures = "0.3.32"
rand = "0.10.0"
libc = "0.2.183"
hickory-proto = { version = "0.25.2", features = [
    "mdns",
], default-features = false }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full"] }
