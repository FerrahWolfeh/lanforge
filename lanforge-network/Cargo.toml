[package]
name = "lanforge-network"
version = "0.19.0"
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Lanforge
lanforge-core = { path = "../lanforge-core" }
lanforge-macros = { path = "../lanforge-macros" }
lanforge-types = { path = "../lanforge-types" }

# Workspace
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "time",
    "net",
    "io-util",
    "macros",
    "sync",
] }
serde = { workspace = true }
tracing = { workspace = true }

# Third party
dhcproto = "0.14.0"
netlink-packet-core = "0.8.1"
pnet = "0.35.0"
rtnetlink = "0.20.0"
netlink-sys = "0.8.8"
socket2 = "0.6.3"
futures = "0.3.32"
rand = "0.10.1"
libc = "0.2.183"
hex = "0.4.3"
lanforge-dns = { path = "../lanforge-dns" }
roaring = "0.11.3"
hotpath = { workspace = true, optional = true }


[features]
hotpath = ["dep:hotpath", "lanforge-core/hotpath"]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "lanforge-core/hotpath-alloc",
]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
